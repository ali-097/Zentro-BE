name: Task
description: Chore, refactor, tooling, docs or infrastructure work
labels: ['type:chore']
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: What does this unblock, or what does it cost us to keep putting off?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      value: |
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 'P0 — blocks other work'
        - 'P1 — needed for the current milestone'
        - 'P2 — should happen'
        - 'P3 — nice to have'
    validations:
      required: true
